{% include "partials/header.html" ignore missing %}
<div class="centered">
  <div class="card">
    <h1>Forgot password</h1>
    <p class="muted">Enter your account email and we’ll send a reset link.</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    {% if ok %}<div class="alert success">{{ ok }}</div>{% endif %}

    <form method="post" action="/auth/forgot">
      <label>Email</label>
      <input name="email" type="email" autocomplete="email" required>
      <button type="submit" class="btnlink">Send reset link</button>
    </form>

    <p class="muted"><a href="/auth/login">Back to login</a></p>
  </div>
</div>
