{% extends "base.html" %}
{% block content %}

<h1>Login</h1>

<div class="card" style="max-width: 420px; margin: 0 auto;">

  {% if error %}
    <div class="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login">
    <div style="margin-bottom:12px;">
      <label class="muted">Username or Email</label>
      <input type="text" name="username" autocomplete="username" required style="width:100%;">
    </div>

    <div style="margin-bottom:12px;">
      <label class="muted">Password</label>
      <input type="password" name="password" autocomplete="current-password" required style="width:100%;">
    </div>

    <button type="submit" class="btnlink" style="width:100%;">Login</button>
  </form>

  <hr style="margin:16px 0; border:none; border-top:1px solid #eee;">

  <div style="text-align:center;">
    <span class="muted">Don’t have an account?</span><br>
    <a href="/auth/register" class="btnlink">Create an account</a>
  </div>

</div>

{% endblock %}
